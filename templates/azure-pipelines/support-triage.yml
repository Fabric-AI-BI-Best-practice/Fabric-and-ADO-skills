# Queue manually with these variables: INCIDENT_ID, SEVERITY, FABRIC_ENVIRONMENT,
# FABRIC_WORKSPACE_ID, and SANITIZED_SUMMARY. Do not paste raw logs into variables.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: |
      python scripts/create_support_packet.py \
        --incident-id "$(INCIDENT_ID)" \
        --severity "$(SEVERITY)" \
        --environment "$(FABRIC_ENVIRONMENT)" \
        --workspace-id "$(FABRIC_WORKSPACE_ID)" \
        --sanitized-summary "$(SANITIZED_SUMMARY)" \
        --pipeline-run "$(Build.BuildUri)" \
        --out "$(Build.ArtifactStagingDirectory)/support-packet.json"
    displayName: Create sanitized support packet

  - task: PublishPipelineArtifact@1
    displayName: Publish support packet
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)"
      artifact: support-packet
