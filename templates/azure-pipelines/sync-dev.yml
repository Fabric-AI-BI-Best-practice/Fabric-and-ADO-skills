# Synchronize the Dev Fabric workspace after an approved merge to dev.
# Create variable group fabric-dev with FABRIC_WORKSPACE_ID.
# Replace the service connection placeholder with a protected, least-privileged connection.

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - fabric/**
      - scripts/**
      - tests/**

pr: none

variables:
  - group: fabric-dev

stages:
  - stage: Validate
    displayName: Validate source
    jobs:
      - job: ValidateFabric
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python scripts/validate_fabric_repository.py --root . --require-fabric-items
          - script: python -m unittest discover -s tests -p "test_*.py"

  - stage: SyncDev
    displayName: Synchronize Dev workspace
    dependsOn: Validate
    jobs:
      - deployment: SyncFabricDev
        displayName: Sync Fabric Dev from Git
        environment: fabric-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: "3.12"
                - task: AzureCLI@2
                  displayName: Get short-lived Fabric token and sync Dev
                  inputs:
                    azureSubscription: "REPLACE_WITH_PROTECTED_FABRIC_DEV_SERVICE_CONNECTION"
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = "Stop"
                      $fabricToken = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken --output tsv
                      if ([string]::IsNullOrWhiteSpace($fabricToken)) { throw "Could not acquire a Fabric access token." }
                      & "$(Build.SourcesDirectory)/scripts/sync-fabric-from-git.ps1" -WorkspaceId "$(FABRIC_WORKSPACE_ID)" -AccessToken $fabricToken -ExpectedRemoteCommit "$(Build.SourceVersion)" -Execute -AllowIncomingOverride | Set-Content -Path "$(Build.ArtifactStagingDirectory)/sync-result.json" -Encoding utf8
                - pwsh: |
                    python scripts/create_release_evidence.py --release-id "dev-$(Build.BuildId)" --environment "dev" --workspace-id "$(FABRIC_WORKSPACE_ID)" --source-branch "$(Build.SourceBranch)" --commit "$(Build.SourceVersion)" --risk-level "moderate" --change-summary "Approved Dev branch synchronization" --validation-status "passed" --approval-kind "fabric-dev" --approval-status "not-required" --pipeline-run "$(Build.BuildUri)" --sync-result "$(Build.ArtifactStagingDirectory)/sync-result.json" --out "$(Build.ArtifactStagingDirectory)/release-evidence.json"
                    python scripts/validate_release_evidence.py --file "$(Build.ArtifactStagingDirectory)/release-evidence.json"
                  displayName: Create Dev release evidence
                - task: PublishPipelineArtifact@1
                  displayName: Publish Dev release evidence
                  condition: always()
                  inputs:
                    targetPath: "$(Build.ArtifactStagingDirectory)"
                    artifact: dev-release-evidence
