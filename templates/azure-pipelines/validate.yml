# PR validation template for a Fabric solution repository.
# Register this YAML in Azure DevOps after copying it into the solution repository.

trigger: none

pr:
  branches:
    include:
      - dev
      - test
      - main
  paths:
    include:
      - fabric/**
      - scripts/**
      - tests/**
      - templates/**

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: python scripts/validate_fabric_repository.py --root . --require-fabric-items
    displayName: Validate Fabric artifact structure and secret patterns

  - script: python -m unittest discover -s tests -p "test_*.py"
    displayName: Run repository tests

  - script: |
      python scripts/create_release_evidence.py \
        --release-id "pr-validation-$(Build.BuildId)" \
        --environment "validation" \
        --workspace-id "not-applicable" \
        --source-branch "$(Build.SourceBranch)" \
        --commit "$(Build.SourceVersion)" \
        --risk-level "low" \
        --change-summary "Pull request validation only" \
        --validation-status "passed" \
        --approval-status "not-required" \
        --pipeline-run "$(Build.BuildUri)" \
        --out "$(Build.ArtifactStagingDirectory)/release-evidence.json"
      python scripts/validate_release_evidence.py \
        --file "$(Build.ArtifactStagingDirectory)/release-evidence.json"
    displayName: Create validation evidence

  - task: PublishPipelineArtifact@1
    displayName: Publish sanitized validation evidence
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)"
      artifact: validation-evidence
