# Synchronize the Test Fabric workspace after an approved merge to test.
# Configure approvals, branch control, and an exclusive lock on fabric-test outside YAML.

trigger:
  branches:
    include:
      - test
  paths:
    include:
      - fabric/**
      - scripts/**
      - tests/**

pr: none

variables:
  - group: fabric-test

stages:
  - stage: Validate
    displayName: Validate source
    jobs:
      - job: ValidateFabric
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python scripts/validate_fabric_repository.py --root . --require-fabric-items
          - script: python -m unittest discover -s tests -p "test_*.py"

  - stage: SyncTest
    displayName: Synchronize Test workspace
    dependsOn: Validate
    lockBehavior: sequential
    jobs:
      - deployment: SyncFabricTest
        displayName: Sync Fabric Test from Git
        environment: fabric-test
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: "3.12"
                - task: AzureCLI@2
                  displayName: Get short-lived Fabric token and sync Test
                  inputs:
                    azureSubscription: "REPLACE_WITH_PROTECTED_FABRIC_TEST_SERVICE_CONNECTION"
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = "Stop"
                      $fabricToken = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken --output tsv
                      if ([string]::IsNullOrWhiteSpace($fabricToken)) { throw "Could not acquire a Fabric access token." }
                      & "$(Build.SourcesDirectory)/scripts/sync-fabric-from-git.ps1" -WorkspaceId "$(FABRIC_WORKSPACE_ID)" -AccessToken $fabricToken -ExpectedRemoteCommit "$(Build.SourceVersion)" -Execute -AllowIncomingOverride | Set-Content -Path "$(Build.ArtifactStagingDirectory)/sync-result.json" -Encoding utf8
                - pwsh: |
                    python scripts/create_release_evidence.py --release-id "test-$(Build.BuildId)" --environment "test" --workspace-id "$(FABRIC_WORKSPACE_ID)" --source-branch "$(Build.SourceBranch)" --commit "$(Build.SourceVersion)" --risk-level "high" --change-summary "Approved Test branch synchronization" --validation-status "passed" --approval-kind "fabric-test" --approval-status "approved" --pipeline-run "$(Build.BuildUri)" --sync-result "$(Build.ArtifactStagingDirectory)/sync-result.json" --out "$(Build.ArtifactStagingDirectory)/release-evidence.json"
                    python scripts/validate_release_evidence.py --file "$(Build.ArtifactStagingDirectory)/release-evidence.json"
                  displayName: Create Test release evidence
                - task: PublishPipelineArtifact@1
                  displayName: Publish Test release evidence
                  condition: always()
                  inputs:
                    targetPath: "$(Build.ArtifactStagingDirectory)"
                    artifact: test-release-evidence
